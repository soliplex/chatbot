name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history and tags so git-cliff can find the previous release
          fetch-depth: 0

      # actions/checkout turns annotated tags into lightweight ones; refetch
      # them so the tag message can be used for the title and intro.
      - name: Fetch tags
        run: git fetch --force --tags

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Check tag matches package.json version
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build widget
        run: npm run build:widget

      - name: Generate changelog
        id: changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: CHANGELOG-release.md

      - name: Compose title and notes
        run: |
          TITLE="$GITHUB_REF_NAME"
          : > RELEASE_NOTES.md
          # An annotated tag ("git tag -a") supplies the title (first line)
          # and an optional intro paragraph (the rest of the message).
          if [ "$(git cat-file -t "$GITHUB_REF_NAME")" = "tag" ]; then
            SUBJECT="$(git tag -l --format='%(contents:subject)' "$GITHUB_REF_NAME")"
            BODY="$(git tag -l --format='%(contents:body)' "$GITHUB_REF_NAME")"
            if [ -n "$SUBJECT" ]; then
              TITLE="$SUBJECT"
            fi
            if [ -n "$BODY" ]; then
              printf '%s\n\n' "$BODY" >> RELEASE_NOTES.md
            fi
          fi
          cat CHANGELOG-release.md >> RELEASE_NOTES.md
          echo "RELEASE_TITLE=$TITLE" >> "$GITHUB_ENV"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$RELEASE_TITLE" \
            --notes-file RELEASE_NOTES.md \
            public/soliplex-chat.js \
            public/soliplex-chat.js.map \
            public/plone_soliplex_tool.js \
            public/soliplex-auth-callback.html
